<!doctype html>
<!-- Source for assets/navva_card.png. Render at 1480x960:
     chrome --headless --screenshot=navva_card.png --window-size=1480,960 --hide-scrollbars card.html
     Add ?t=paper for the archival dossier version. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:opsz,wght@6..72,400..500&family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap">
<style>
  :root { --bg: #080c0b; --ink: #e5eee7; --soft: #a9b8ae; --title: #a6dfbf; --brass: #d3a54f; --rec: #f06a61; --machine: #55b5d9; --human: #dd7cba; --off: #101713; --offl: #2c3d34;
    --p0: #c9c9c2; --p1: #c4bb4e; --p2: #55b5b0; --p3: #5fae62; --p4: #a65c9e; --p5: #b9504a; --p6: #4a5fae; --p7: #a6dfbf; }
  .paper { --bg: #fbf6ea; --ink: #382b22; --soft: #6f5c4b; --title: #571c28; --brass: #805f26; --rec: #712936; --machine: #2d6692; --human: #8d3f70; --off: #f2e9d7; --offl: #d1c0a5;
    --p0: #aa9270; --p1: #805f26; --p2: #2d6692; --p3: #66733b; --p4: #8d3f70; --p5: #9a3e32; --p6: #712936; --p7: #6f5c4b; }
  body.paper { background: #f2e9d7; }
  body.paper::after { inset: 34px; border: 1px solid #aa9270; border-top: 6px solid #712936; box-shadow: none; }
  body.paper::before { content: ""; position: absolute; inset: 34px; background: #fbf6ea; z-index: -1; }
  .paper .osd { font: 500 22px/1 "IBM Plex Mono", monospace; letter-spacing: 0.14em; top: 62px; }
  .paper .rec i { display: none; } .paper h1 { text-shadow: none; }
  .paper .title { border-left: 6px double #712936; padding-left: 34px; }
  html, body { margin: 0; width: 1480px; height: 960px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); z-index: 0; font-family: "IBM Plex Mono", monospace; position: relative;
    background-image: repeating-linear-gradient(0deg, rgba(126,255,197,0.05) 0, rgba(126,255,197,0.05) 2px, transparent 2px, transparent 5px), radial-gradient(ellipse at 50% 0%, #1a2b24 0%, #080c0b 72%); }
  body::after { content: ""; position: absolute; inset: 0; border: 10px solid #284438; box-shadow: inset 0 0 180px rgba(0,0,0,0.7); pointer-events: none; }
  .osd { position: absolute; top: 44px; left: 80px; right: 80px; display: flex; justify-content: space-between; font: 400 44px/1 "VT323", monospace; letter-spacing: 0.06em; }
  .rec { color: var(--rec); } .rec i { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: currentColor; margin-right: 14px; }
  .tc { color: var(--brass); }
  .title { position: absolute; top: 132px; left: 80px; right: 80px; }
  .label { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); }
  h1 { font: 600 90px/1.08 "Archivo", sans-serif; letter-spacing: -0.015em; color: var(--title); margin: 24px 0 28px; }
  .dek { font: 400 38px/1.3 "Newsreader", Georgia, serif; color: var(--ink); margin: 0; }
  .b h1 { font: 800 76px/1.06 "Archivo", sans-serif; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.005em; }
  .b .dek { font: 400 34px/1.3 "Archivo", sans-serif; }
  .wall { position: absolute; left: 80px; right: 80px; bottom: 112px; }
  .wall svg { width: 100%; display: block; overflow: visible; }
  .wall text { font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: 0.12em; }
  .foot { position: absolute; bottom: 50px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 20px; letter-spacing: 0.14em; color: var(--soft); }
  .foot b { color: var(--brass); font-weight: 500; }
</style>
</head>
<body>
  <div class="osd"><span class="rec"><i></i>REC</span><span class="tc">2016–2026</span></div>
  <div class="title">
    <span class="label">AHRC Collaborative Doctoral Partnership</span>
    <h1>From Narratives of Value to Valuable Algorithms</h1>
    <p class="dek">A decade of promotional screen culture in the UK, seen by machine</p>
  </div>
  <div class="wall"><svg id="wall" viewBox="0 0 1320 250"></svg></div>
  <div class="foot"><span><b>NaVVA</b> &nbsp; KING'S COLLEGE LONDON × BRITISH FILM INSTITUTE</span><span>PHD PROJECT 2025–2029</span></div>
  <script>
    if (location.search.indexOf("v=b") > -1) document.body.classList.add("b");
    if (location.search.indexOf("t=paper") > -1) { document.body.classList.add("paper"); document.querySelector(".rec").lastChild.textContent = "REF. NaVVA"; }
    (function (svg) {
      // The whole collection is seen by machine; a few adverts are picked out and read closely.
      var pal = [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) { return "var(--p" + i + ")"; });
      var cols = 60, rows = 10, pw = 22, ph = 14, fw = 20, fh = 11, top = 36, s = 7, h = "", fills = {};
      var picks = [[7, 2], [19, 6], [31, 3], [44, 7], [53, 1]], soft = "var(--scr-soft, var(--soft))", rule = "var(--w-off-line, var(--offl))";
      function rnd() { s = (s * 16807) % 2147483647; return s / 2147483647; }
      svg.setAttribute("viewBox", "0 0 1320 212");
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
        var col = pal[Math.floor(rnd() * pal.length)], o = (0.3 + rnd() * 0.6).toFixed(2);
        fills[c + "," + r] = col;
        h += '<rect x="' + (c * pw + 1) + '" y="' + (top + r * ph) + '" width="' + fw + '" height="' + fh + '" fill="' + col + '" fill-opacity="' + o + '"/>';
      }
      picks.forEach(function (p) {
        var cx = p[0] * pw + 1 + fw / 2, cy = top + p[1] * ph + fh / 2;
        h += '<rect x="' + (cx - 19) + '" y="' + (cy - 11) + '" width="38" height="22" fill="var(--scr-bg, var(--bg))"/>';
        h += '<rect x="' + (cx - 19) + '" y="' + (cy - 11) + '" width="38" height="22" fill="' + fills[p[0] + "," + p[1]] + '" stroke="var(--human)" stroke-width="2.5"/>';
      });
      h += '<path d="M1 28V22H1319V28" fill="none" stroke="var(--machine)" stroke-width="1.5"/>';
      h += '<text x="1" y="13" fill="var(--machine)">SEEN BY MACHINE · ALL OF THEM</text>';
      h += '<text x="1319" y="13" fill="var(--human)" text-anchor="end">READ CLOSELY · A FEW</text>';
      h += '<text x="1" y="206" fill="' + soft + '">2016</text><text x="1319" y="206" fill="' + soft + '" text-anchor="end">2026</text>';
      h += '<path d="M62 201H1258" stroke="' + rule + '"/>';
      svg.innerHTML = h;
    })(document.getElementById("wall"));
  </script>
</body>
</html>
